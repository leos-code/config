# Usage:
# - Prefix is set to Ctrl-a (make sure you remapped Caps Lock to Ctrl)
# - All prefixed with Ctrl-a
#   - Last used window: /
#   - Last used pane:   ;
#   - Vertical split:   v
#   - Horizontal split: s
#   - Previous window:  [
#   - Next window:      ]
#   - Choose session:   Ctrl-s
#   - Quick window:     Ctrl-q

# 使用 vi 风格的按键模式
set-option -g status-keys vi
set-window-option -g mode-keys vi

# --- 前缀键修改 ---
# 将前缀从 C-b 改为 C-a
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# --- 窗口与面板管理 ---

# 重新加载配置文件
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded"

# 上一个/下一个窗口 (使用 [ 和 ])
unbind [
bind [ previous-window
unbind ]
bind ] next-window

# 最后一个窗口
unbind /
bind / last-window

# 分割窗口 (使用 s 和 v)
unbind %
unbind '"'
bind s split-window -v
bind v split-window -h

# 面板导航 (Vim 风格 h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 循环选择面板 (o 键反向)
unbind o
bind o select-pane -t :.-

# 交换面板位置 (使用 { 和 })
unbind '{'
bind '{' swap-pane -D
unbind '}'
bind '}' swap-pane -U

# 快速窗口命令 (C-q 打开 htop)
bind C-q command-prompt -I "htop" -p "Quick window command: " "new-window '%%'"
# ==========================================
# 基础与系统设置 (SYSTEM & DEFAULTS)
# ==========================================

# 解决 zsh 和 pbcopy 问题
# 注意：在较新的 macOS 和 tmux 版本中，通常不再强制需要 reattach-to-user-namespace
# 但为了兼容旧习惯，保留此逻辑，如果遇到 'command not found' 错误，可注释掉下面这一行
# set-option -g default-command "reattach-to-user-namespace -l zsh"

# 开启 256 色支持
set -g default-terminal "xterm-256color"

# 启用鼠标 (新版语法，替代了原来的 mode-mouse, mouse-select-pane 等)
set -g mouse on

# 移除 UTF-8 设置 (Tmux 2.2+ 已自动处理，保留会导致报错)
# set-window-option -g utf8 on 

# 0 延迟，对 vim 用户友好
set -sg escape-time 0

# 窗口和面板从 1 开始计数
set -g base-index 0
setw -g pane-base-index 0

# 状态栏刷新频率
set -g status-interval 5

# ==========================================
# 键位绑定 (KEYS)
# ==================================prompt -I "htop" -p "Quick window command: " "new-window '%%'"

# 会话选择
bind C-s choose-session

# ==========================================
# 复制模式与剪贴板 (COPY MODE)
# ==========================================

# 进入复制模式
bind Escape copy-mode

# 粘贴缓冲区
bind p paste-buffer

# --- 新版语法适配 (重要修改) ---
# 旧版 bind -t vi-copy 已废弃，改为 bind -T copy-mode-vi

# 'v' 开始选择
bind -T copy-mode-vi v send -X begin-selection

# 'y' 复制选区 (这里整合了 macOS pbcopy)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# C-c 将 tmux 缓冲区内容复制到系统剪贴板 (macOS)
bind C-c run "tmux save-buffer - | pbcopy"

# C-v 将系统剪贴板内容粘贴到 tmux
bind C-v run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"

# ==========================================
# 外观与配色 (LOOK & FEEL)
# ==========================================
# 注意：旧版 *-fg, *-bg, *-attr 语法已废弃，改为 -style 语法

# 默认状态栏颜色
set-option -g status-style fg=colour179,bg=colour235

# 默认窗口标题颜色
set-window-option -g window-status-style fg=colour244,bg=default

# 当前激活窗口标题颜色
set-window-option -g window-status-current-style fg=colour166,bg=default,bright

# 面板边框颜色
set-option -g pane-border-style fg=colour235
set-option -g pane-active-border-style fg=colour240

# 面板编号显示颜色
set-option -g display-panes-active-colour colour33
set-option -g display-panes-colour colour166

# 时钟模式颜色
set-window-option -g clock-mode-colour colour64

# 状态栏右侧长度
set -g status-right-length 65
